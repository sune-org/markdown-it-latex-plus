version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: bun
    directories:
      - "/"
      - "/site"
    schedule:
      interval: monthly
    cooldown:
      default-days: 14
    groups:
      bun-minor-and-patch:
        update-types:
          - minor
          - patch
